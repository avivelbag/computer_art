<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0e0e12"/>

  <!-- Iron-filing short segments scattered across the canvas -->
  <!-- Top-left region — field curving around left dipole -->
  <line x1="28" y1="92"  x2="40" y2="86"  stroke="#8a5510" stroke-width="0.7" opacity="0.45"/>
  <line x1="52" y1="78"  x2="66" y2="74"  stroke="#9a6018" stroke-width="0.7" opacity="0.50"/>
  <line x1="78" y1="66"  x2="92" y2="65"  stroke="#a07020" stroke-width="0.7" opacity="0.55"/>
  <line x1="105" y1="60" x2="119" y2="61" stroke="#a87828" stroke-width="0.8" opacity="0.60"/>
  <line x1="132" y1="58" x2="146" y2="60" stroke="#b08030" stroke-width="0.8" opacity="0.62"/>
  <line x1="158" y1="60" x2="170" y2="64" stroke="#b88538" stroke-width="0.8" opacity="0.65"/>
  <!-- Top-center — near between the dipoles -->
  <line x1="185" y1="68" x2="190" y2="80" stroke="#d09038" stroke-width="0.9" opacity="0.75"/>
  <line x1="200" y1="62" x2="200" y2="76" stroke="#e0a840" stroke-width="0.9" opacity="0.80"/>
  <line x1="210" y1="68" x2="215" y2="80" stroke="#d09038" stroke-width="0.9" opacity="0.75"/>
  <!-- Top-right region -->
  <line x1="230" y1="60" x2="242" y2="64" stroke="#b88538" stroke-width="0.8" opacity="0.65"/>
  <line x1="254" y1="58" x2="268" y2="60" stroke="#b08030" stroke-width="0.8" opacity="0.62"/>
  <line x1="281" y1="60" x2="295" y2="61" stroke="#a87828" stroke-width="0.8" opacity="0.60"/>
  <line x1="308" y1="66" x2="322" y2="65" stroke="#a07020" stroke-width="0.7" opacity="0.55"/>
  <line x1="334" y1="78" x2="348" y2="74" stroke="#9a6018" stroke-width="0.7" opacity="0.50"/>
  <line x1="360" y1="92" x2="372" y2="86" stroke="#8a5510" stroke-width="0.7" opacity="0.45"/>

  <!-- Left side filings -->
  <line x1="22" y1="120" x2="36" y2="118" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="22" y1="148" x2="36" y2="150" stroke="#9a6818" stroke-width="0.7" opacity="0.50"/>
  <line x1="22" y1="178" x2="36" y2="182" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="22" y1="200" x2="36" y2="200" stroke="#9a6818" stroke-width="0.7" opacity="0.50"/>
  <line x1="22" y1="228" x2="36" y2="232" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="22" y1="252" x2="36" y2="250" stroke="#8a5810" stroke-width="0.7" opacity="0.46"/>
  <!-- Right side filings -->
  <line x1="364" y1="120" x2="378" y2="118" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="364" y1="148" x2="378" y2="150" stroke="#9a6818" stroke-width="0.7" opacity="0.50"/>
  <line x1="364" y1="178" x2="378" y2="182" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="364" y1="200" x2="378" y2="200" stroke="#9a6818" stroke-width="0.7" opacity="0.50"/>
  <line x1="364" y1="228" x2="378" y2="232" stroke="#906010" stroke-width="0.7" opacity="0.48"/>
  <line x1="364" y1="252" x2="378" y2="250" stroke="#8a5810" stroke-width="0.7" opacity="0.46"/>

  <!-- Middle equatorial filings — perpendicular to the axis (field is anti-parallel to m) -->
  <line x1="48"  y1="198" x2="60"  y2="200" stroke="#9a6618" stroke-width="0.8" opacity="0.52"/>
  <line x1="72"  y1="196" x2="84"  y2="200" stroke="#a87028" stroke-width="0.8" opacity="0.58"/>
  <line x1="96"  y1="196" x2="108" y2="200" stroke="#b88030" stroke-width="0.8" opacity="0.64"/>
  <!-- Near left N pole — brighter gold (strong field) -->
  <line x1="116" y1="196" x2="126" y2="200" stroke="#d09838" stroke-width="0.9" opacity="0.72"/>
  <line x1="296" y1="196" x2="284" y2="200" stroke="#d09838" stroke-width="0.9" opacity="0.72"/>
  <line x1="304" y1="196" x2="316" y2="200" stroke="#b88030" stroke-width="0.8" opacity="0.64"/>
  <line x1="328" y1="196" x2="340" y2="200" stroke="#a87028" stroke-width="0.8" opacity="0.58"/>
  <line x1="352" y1="198" x2="364" y2="200" stroke="#9a6618" stroke-width="0.8" opacity="0.52"/>

  <!-- Between dipoles centre — strongest field compression -->
  <line x1="188" y1="192" x2="192" y2="206" stroke="#f0c040" stroke-width="1.1" opacity="0.90"/>
  <line x1="200" y1="190" x2="200" y2="208" stroke="#f5d060" stroke-width="1.2" opacity="0.95"/>
  <line x1="208" y1="192" x2="212" y2="206" stroke="#f0c040" stroke-width="1.1" opacity="0.90"/>

  <!-- Bottom filings -->
  <line x1="28"  y1="308" x2="40"  y2="314" stroke="#8a5510" stroke-width="0.7" opacity="0.45"/>
  <line x1="52"  y1="322" x2="66"  y2="326" stroke="#9a6018" stroke-width="0.7" opacity="0.50"/>
  <line x1="78"  y1="334" x2="92"  y2="335" stroke="#a07020" stroke-width="0.7" opacity="0.55"/>
  <line x1="105" y1="340" x2="119" y2="339" stroke="#a87828" stroke-width="0.8" opacity="0.60"/>
  <line x1="132" y1="342" x2="146" y2="340" stroke="#b08030" stroke-width="0.8" opacity="0.62"/>
  <line x1="158" y1="340" x2="170" y2="336" stroke="#b88538" stroke-width="0.8" opacity="0.65"/>
  <line x1="185" y1="332" x2="190" y2="320" stroke="#d09038" stroke-width="0.9" opacity="0.75"/>
  <line x1="200" y1="338" x2="200" y2="324" stroke="#e0a840" stroke-width="0.9" opacity="0.80"/>
  <line x1="210" y1="332" x2="215" y2="320" stroke="#d09038" stroke-width="0.9" opacity="0.75"/>
  <line x1="230" y1="340" x2="242" y2="336" stroke="#b88538" stroke-width="0.8" opacity="0.65"/>
  <line x1="254" y1="342" x2="268" y2="340" stroke="#b08030" stroke-width="0.8" opacity="0.62"/>
  <line x1="281" y1="340" x2="295" y2="339" stroke="#a87828" stroke-width="0.8" opacity="0.60"/>
  <line x1="308" y1="334" x2="322" y2="335" stroke="#a07020" stroke-width="0.7" opacity="0.55"/>
  <line x1="334" y1="322" x2="348" y2="326" stroke="#9a6018" stroke-width="0.7" opacity="0.50"/>
  <line x1="360" y1="308" x2="372" y2="314" stroke="#8a5510" stroke-width="0.7" opacity="0.45"/>

  <!-- Upper arc field lines — left dipole (N at 140,200 going to S at 80,200) -->
  <!-- These trace the closed magnetic loops: exit north, arc, return to south -->
  <path d="M 142 186 Q 110 148 82 186"  stroke="#c8871a" stroke-width="1.0" fill="none" opacity="0.65"/>
  <path d="M 143 178 Q 110 118 82 178"  stroke="#ba7c18" stroke-width="0.9" fill="none" opacity="0.58"/>
  <path d="M 143 168 Q 110 90  82 168"  stroke="#ae7214" stroke-width="0.85" fill="none" opacity="0.50"/>
  <path d="M 142 158 Q 110 56  82 158"  stroke="#a26810" stroke-width="0.8" fill="none" opacity="0.42"/>
  <!-- Lower arcs left dipole -->
  <path d="M 142 214 Q 110 252 82 214"  stroke="#c8871a" stroke-width="1.0" fill="none" opacity="0.65"/>
  <path d="M 143 222 Q 110 282 82 222"  stroke="#ba7c18" stroke-width="0.9" fill="none" opacity="0.58"/>
  <path d="M 143 232 Q 110 310 82 232"  stroke="#ae7214" stroke-width="0.85" fill="none" opacity="0.50"/>
  <path d="M 142 242 Q 110 344 82 242"  stroke="#a26810" stroke-width="0.8" fill="none" opacity="0.42"/>

  <!-- Upper arc field lines — right dipole (N at 260,200 going to S at 320,200) -->
  <path d="M 258 186 Q 290 148 318 186"  stroke="#c8871a" stroke-width="1.0" fill="none" opacity="0.65"/>
  <path d="M 257 178 Q 290 118 318 178"  stroke="#ba7c18" stroke-width="0.9" fill="none" opacity="0.58"/>
  <path d="M 257 168 Q 290 90  318 168"  stroke="#ae7214" stroke-width="0.85" fill="none" opacity="0.50"/>
  <path d="M 258 158 Q 290 56  318 158"  stroke="#a26810" stroke-width="0.8" fill="none" opacity="0.42"/>
  <!-- Lower arcs right dipole -->
  <path d="M 258 214 Q 290 252 318 214"  stroke="#c8871a" stroke-width="1.0" fill="none" opacity="0.65"/>
  <path d="M 257 222 Q 290 282 318 222"  stroke="#ba7c18" stroke-width="0.9" fill="none" opacity="0.58"/>
  <path d="M 257 232 Q 290 310 318 232"  stroke="#ae7214" stroke-width="0.85" fill="none" opacity="0.50"/>
  <path d="M 258 242 Q 290 344 318 242"  stroke="#a26810" stroke-width="0.8" fill="none" opacity="0.42"/>

  <!-- Cross-dipole arcs (N of left dipole → S of right dipole, large sweep) -->
  <path d="M 143 192 C 143 40  318 40  318 192"  stroke="#d49828" stroke-width="1.05" fill="none" opacity="0.60"/>
  <path d="M 143 208 C 143 360 318 360 318 208"  stroke="#d49828" stroke-width="1.05" fill="none" opacity="0.60"/>

  <!-- Inner arcs between the two N poles (compressed repulsive field) -->
  <path d="M 142 188 Q 200 162 258 188"  stroke="#e8b038" stroke-width="1.1" fill="none" opacity="0.72"/>
  <path d="M 142 212 Q 200 238 258 212"  stroke="#e8b038" stroke-width="1.1" fill="none" opacity="0.72"/>
  <path d="M 142 180 Q 200 148 258 180"  stroke="#d4982a" stroke-width="0.95" fill="none" opacity="0.60"/>
  <path d="M 142 220 Q 200 252 258 220"  stroke="#d4982a" stroke-width="0.95" fill="none" opacity="0.60"/>

  <!-- Glow halos behind N poles -->
  <circle cx="140" cy="200" r="24" fill="rgba(245,208,96,0.06)"/>
  <circle cx="260" cy="200" r="24" fill="rgba(245,208,96,0.06)"/>

  <!-- S pole — left dipole (x=80, y=200) -->
  <circle cx="80" cy="200" r="12" fill="#2a1804" stroke="#7a4810" stroke-width="1.5"/>
  <text x="80" y="205" fill="#c8871a" font-size="12" font-family="system-ui,sans-serif" font-weight="bold" text-anchor="middle">S</text>

  <!-- N pole — left dipole (x=140, y=200) -->
  <circle cx="140" cy="200" r="12" fill="#c8871a" stroke="#f5d060" stroke-width="1.5"/>
  <text x="140" y="205" fill="#0e0e12" font-size="12" font-family="system-ui,sans-serif" font-weight="bold" text-anchor="middle">N</text>

  <!-- N pole — right dipole (x=260, y=200) -->
  <circle cx="260" cy="200" r="12" fill="#c8871a" stroke="#f5d060" stroke-width="1.5"/>
  <text x="260" y="205" fill="#0e0e12" font-size="12" font-family="system-ui,sans-serif" font-weight="bold" text-anchor="middle">N</text>

  <!-- S pole — right dipole (x=320, y=200) -->
  <circle cx="320" cy="200" r="12" fill="#2a1804" stroke="#7a4810" stroke-width="1.5"/>
  <text x="320" y="205" fill="#c8871a" font-size="12" font-family="system-ui,sans-serif" font-weight="bold" text-anchor="middle">S</text>

  <!-- Title text -->
  <text x="200" y="374" fill="#c8871a" font-size="11" font-family="system-ui,sans-serif"
        text-anchor="middle" letter-spacing="0.10em" opacity="0.85">MAGNETIC DIPOLE FIELD LINES</text>
  <text x="200" y="390" fill="#6a4010" font-size="9" font-family="system-ui,sans-serif"
        text-anchor="middle" letter-spacing="0.07em" opacity="0.65">Iron Filings · RK4 Streamlines · ∇·B = 0</text>
</svg>
