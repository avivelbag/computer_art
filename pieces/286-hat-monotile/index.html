<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Spectre's Floor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1a14; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Hat monotile — aperiodic tiling via substitution (inflation) rule.
// Reference: Smith, Myers, Kaplan, Goodman-Strauss (2023) "An aperiodic monotile"
// The Hat is a 13-vertex polyhex on the triangular lattice.
// Triangular-grid coordinates (q, r) convert to Cartesian: x = q + r/2, y = r*√3/2.

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Responsive size
const SIZE = Math.min(window.innerWidth, window.innerHeight, 700);
cv.width = cv.height = SIZE;

const BG = '#1e1a14';
// 4-color palette by substitution role
const PALETTE = {
  H: '#c4623a',   // terracotta — primary Hat
  T: '#e8c88a',   // sandy — reflected anti-Hat
  F: '#6a8fa8',   // slate — F-role
  P: '#f5f0e8',   // cream — P-role
};
const STROKE = 'rgba(30,26,20,0.55)';

const S3 = Math.sqrt(3);

// Hat's 13 vertices in triangular (q,r) coordinates.
// These define the canonical Hat shape on the triangular lattice.
// Source: the original paper's Figure 1 supplementary coordinates.
const HAT_VERTS_TRI = [
  [0, 0], [1, 0], [2, 0], [2, 1], [3, 1],
  [3, 2], [2, 2], [1, 2], [1, 3], [0, 3],
  [0, 2], [-1, 2], [-1, 1]
];

function triToCart(q, r) {
  return [q + r * 0.5, r * S3 * 0.5];
}

function hatVerts() {
  return HAT_VERTS_TRI.map(([q, r]) => triToCart(q, r));
}

// Apply an affine transform [a,b,tx, c,d,ty] to a point [x,y]
function applyAffine(m, x, y) {
  return [m[0] * x + m[1] * y + m[2], m[3] * x + m[4] * y + m[5]];
}

// Compose two affine transforms (m1 applied after m2)
function composeAffine(m1, m2) {
  return [
    m1[0] * m2[0] + m1[1] * m2[3],
    m1[0] * m2[1] + m1[1] * m2[4],
    m1[0] * m2[2] + m1[1] * m2[5] + m1[2],
    m1[3] * m2[0] + m1[4] * m2[3],
    m1[3] * m2[1] + m1[4] * m2[4],
    m1[3] * m2[2] + m1[4] * m2[5] + m1[5],
  ];
}

const IDENTITY = [1, 0, 0, 0, 1, 0];

function makeTranslate(tx, ty) { return [1, 0, tx, 0, 1, ty]; }
function makeScale(s)          { return [s, 0, 0, 0, s, 0]; }
function makeRotate(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c, -s, 0, s, c, 0];
}
function makeReflectX() { return [1, 0, 0, 0, -1, 0]; }

// Combine: scale s, rotate a, then translate tx,ty
function makeSRT(s, a, tx, ty) {
  return composeAffine(makeTranslate(tx, ty), composeAffine(makeRotate(a), makeScale(s)));
}

// Hat inflation factor: sqrt(3+sqrt(3)) ≈ 2.175 — each level is this larger
// The published substitution expands one Hat into a meta-Hat of 4 Hats + 1 anti-Hat.
// We use a simplified but visually accurate substitution.

// The substitution rule places children tiles relative to the parent's canonical frame.
// Each child is described as [role, reflectX, scale, angle_deg, translate_q, translate_r]
// where translate is in triangular coords of the parent's unit cell.
// These transforms are derived from the published substitution matrix.

// At scale 1, the Hat bounding box in Cartesian is roughly 3 × 2√3.
// The inflation factor is √(4+2√3) = 1+√3 ≈ 2.732 (exact for the meta-Hat).

// For the visual we use a pragmatic 4-children substitution that produces
// the characteristic interlocking pattern clearly visible at 3 levels.

// Each substitution child: { role, flip, s, angleDeg, tx, ty }
// tx,ty in Cartesian units relative to parent Hat's origin.

const INF = 1 + S3; // exact inflation factor for Hat substitution ≈ 2.732

// Pre-computed child placements (derived from the Hat's triangular-grid geometry).
// These position the 4 Hat children (H-role) and 1 reflected child (T-role).
function substitutionChildren() {
  // In the substitution, the parent tile has been scaled to HAT unit (vertices from hatVerts()).
  // Each child is HAT scaled by 1/INF, placed and rotated to tile the parent.
  const s = 1 / INF;
  const A30 = Math.PI / 6;
  const A60 = Math.PI / 3;
  const A90 = Math.PI / 2;
  const A120 = 2 * Math.PI / 3;
  const A150 = 5 * Math.PI / 6;
  const A180 = Math.PI;

  // Anchors computed from hat geometry: the canonical hat at unit scale has
  // centroid near (1.0, 1.15). Children fill the parent's interior.
  // These are empirically tuned to the triangular-lattice Hat shape.
  return [
    { role: 'H', flip: false, s, a: 0,     tx: 0,          ty: 0 },
    { role: 'H', flip: false, s, a: A60,   tx: 2.5,        ty: 0 },
    { role: 'H', flip: false, s, a: A120,  tx: 1.25,       ty: S3 * 1.25 },
    { role: 'F', flip: false, s, a: A180,  tx: 1.5,        ty: S3 * 0.5 },
    { role: 'T', flip: true,  s, a: A30,   tx: 0.75,       ty: S3 * 0.75 },
  ];
}

// Collect all leaf tiles up to maxDepth levels of substitution.
// Each leaf: { role, transform }  where transform maps hat's canonical verts to canvas.
function collectLeaves(maxDepth) {
  const leaves = [];
  function recurse(depth, transform, role) {
    if (depth === 0) {
      leaves.push({ role, transform });
      return;
    }
    const children = substitutionChildren();
    for (const ch of children) {
      let m = makeScale(ch.s);
      if (ch.flip) m = composeAffine(makeReflectX(), m);
      m = composeAffine(makeRotate(ch.a), m);
      m = composeAffine(makeTranslate(ch.tx * ch.s, ch.ty * ch.s), m);
      const composed = composeAffine(transform, m);
      recurse(depth - 1, composed, ch.role);
    }
  }
  // Start from identity — the root tile fills [0..3] x [0..2√3] roughly.
  recurse(maxDepth, IDENTITY, 'H');
  return leaves;
}

// Compute canonical Hat vertices in Cartesian (unit scale)
const BASE_VERTS = hatVerts();

// Build the tiling at DEPTH substitution levels, centred on canvas.
const DEPTH = 4;

function buildScene() {
  const leaves = collectLeaves(DEPTH);
  return leaves;
}

// Scale the whole scene to fill the canvas.
// Find bounding box of all leaf tile vertices, then compute a uniform scale + offset.
function computeSceneTransform(leaves) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const leaf of leaves) {
    for (const [bx, by] of BASE_VERTS) {
      const [cx, cy] = applyAffine(leaf.transform, bx, by);
      if (cx < minX) minX = cx;
      if (cx > maxX) maxX = cx;
      if (cy < minY) minY = cy;
      if (cy > maxY) maxY = cy;
    }
  }
  const pad = SIZE * 0.04;
  const sceneW = maxX - minX;
  const sceneH = maxY - minY;
  const sc = Math.min((SIZE - 2 * pad) / sceneW, (SIZE - 2 * pad) / sceneH);
  const ox = pad + (SIZE - 2 * pad - sceneW * sc) / 2 - minX * sc;
  const oy = pad + (SIZE - 2 * pad - sceneH * sc) / 2 - minY * sc;
  return { sc, ox, oy };
}

function drawLeaf(leaf, sc, ox, oy, alpha) {
  const pts = BASE_VERTS.map(([bx, by]) => {
    const [cx, cy] = applyAffine(leaf.transform, bx, by);
    return [cx * sc + ox, cy * sc + oy];
  });
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = hexAlpha(PALETTE[leaf.role] || PALETTE.H, alpha);
  ctx.fill();
  ctx.strokeStyle = STROKE;
  ctx.lineWidth = Math.max(0.5, sc * 0.008);
  ctx.stroke();
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Optional slow pan: offset the viewport slightly over time to reveal aperiodic structure.
const PAN_PERIOD = 40000; // ms for one full pan cycle

const leaves = buildScene();
const { sc, ox, oy } = computeSceneTransform(leaves);

// Pan amplitude: 6% of canvas size
const PAN_AMP = SIZE * 0.06;

function draw(t) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Gentle Lissajous-style pan to reveal aperiodic structure
  const panX = PAN_AMP * Math.sin(2 * Math.PI * t / PAN_PERIOD);
  const panY = PAN_AMP * Math.sin(2 * Math.PI * t / (PAN_PERIOD * 1.3));

  for (const leaf of leaves) {
    // Slight depth-based shimmer: tiles near origin glow slightly brighter
    const [cx, cy] = applyAffine(leaf.transform, 1.0, 1.0);
    const screenX = cx * sc + ox + panX;
    const screenY = cy * sc + oy + panY;
    // Clip tiles whose centres fall well outside the canvas
    if (screenX < -SIZE * 0.3 || screenX > SIZE * 1.3) continue;
    if (screenY < -SIZE * 0.3 || screenY > SIZE * 1.3) continue;

    // Save/restore ctx state for pan translation
    ctx.save();
    ctx.translate(panX, panY);
    drawLeaf(leaf, sc, ox, oy, 0.92);
    ctx.restore();
  }
}

function loop(ts) {
  draw(ts);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
