<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>273 — The Grain of Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    canvas { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="800"></canvas>
  <script>
    const W = 800, H = 800;

    // Standard 8×8 Bayer ordered-dithering matrix (values 0–63).
    // Each entry is a threshold: pixel is "on" if plasma > entry/64.
    const BAYER8 = new Uint8Array([
       0, 32,  8, 40,  2, 34, 10, 42,
      48, 16, 56, 24, 50, 18, 58, 26,
      12, 44,  4, 36, 14, 46,  6, 38,
      60, 28, 52, 20, 62, 30, 54, 22,
       3, 35, 11, 43,  1, 33,  9, 41,
      51, 19, 59, 27, 49, 17, 57, 25,
      15, 47,  7, 39, 13, 45,  5, 37,
      63, 31, 55, 23, 61, 29, 53, 21,
    ]);

    const BG_R = 13,  BG_G = 13,  BG_B = 13;    // #0d0d0d — near-black
    const FG_R = 232, FG_G = 201, FG_B = 122;   // #e8c97a — sand gold

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(W, H);
    const px = img.data;

    // Precompute radial distance × 12π for every pixel at startup; the factor
    // never changes, so this saves one multiply inside the hot inner loop.
    const RD = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = x / W - 0.5, dy = y / H - 0.5;
        RD[y * W + x] = Math.sqrt(dx * dx + dy * dy) * (12 * Math.PI);
      }
    }

    // Reusable per-frame partial-sum arrays; allocated once to avoid GC churn.
    // xterms[x] = sin(x/W · 3π + t·0.7) — varies only with x and t
    // yterms[y] = sin(y/H · 4π + t·0.5) — varies only with y and t
    // dterms[x+y] = sin((x+y)/W · 5π + t·0.3) — diagonal term; because W=H,
    //   x/W + y/H = (x+y)/W, so this is a function of (x+y) alone.
    const xterms = new Float32Array(W);
    const yterms = new Float32Array(H);
    const dterms = new Float32Array(W + H - 1);

    const P3 = Math.PI * 3;
    const P4 = Math.PI * 4;
    const P5 = Math.PI * 5 / W;

    function render(t) {
      const t07 = t * 0.7, t05 = t * 0.5, t03 = t * 0.3, t09 = t * 0.9;

      for (let x = 0; x < W; x++) xterms[x] = Math.sin(x / W * P3 + t07);
      for (let y = 0; y < H; y++) yterms[y] = Math.sin(y / H * P4 + t05);
      for (let s = 0; s < W + H - 1; s++) dterms[s] = Math.sin(s * P5 + t03);

      for (let y = 0; y < H; y++) {
        const brow = (y & 7) << 3;
        const yt = yterms[y];
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          // Four-term plasma: each term ∈ [-1,1], sum ∈ [-4,4].
          // Adding 4 and dividing by 8 maps to [0,1].
          const v = (xterms[x] + yt + dterms[x + y] + Math.sin(RD[idx] + t09) + 4) * 0.125;
          const on = v > BAYER8[brow + (x & 7)] * (1 / 64);
          const i = idx << 2;
          px[i]     = on ? FG_R : BG_R;
          px[i + 1] = on ? FG_G : BG_G;
          px[i + 2] = on ? FG_B : BG_B;
          px[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    let start = null;
    function frame(ts) {
      if (!start) start = ts;
      render((ts - start) * 0.001);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
