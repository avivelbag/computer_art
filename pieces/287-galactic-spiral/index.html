<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Density Wave — Galactic Spiral</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #04040c; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    canvas { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); }
  </style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const W = 800, H = 800, CX = W >> 1, CY = H >> 1;
const N = 5500;
const ARMS = 3;
const A = 14, B = 0.22;       // logarithmic spiral r = A·exp(B·θ)
const MAX_R = 340;
const VC = 0.038;              // flat rotation curve: tangential speed is constant (px/frame)
const OMEGA_P = 1e-4;          // arm pattern rotation speed (rad/frame) — slower than inner stars
const SIG2 = 2 * 0.32 * 0.32; // 2σ² for Gaussian arm-proximity falloff
const TAU = Math.PI * 2;
const ARM_STEP = TAU / ARMS;

/**
 * Box-Muller transform: returns a single standard-normal random variate.
 * Used for Gaussian scatter of stars around arm loci during initialisation.
 */
function gauss() {
  let u, v;
  do { u = Math.random(); } while (u === 0);
  do { v = Math.random(); } while (v === 0);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

// Star state in typed arrays for tight memory layout and fast iteration
const sR      = new Float32Array(N);  // fixed orbital radius (px)
const sTheta  = new Float32Array(N);  // current angular position (rad)
const sOmega  = new Float32Array(N);  // angular velocity (rad/frame) = VC / r
const sLogR   = new Float32Array(N);  // precomputed log(r/A)/B — the arm angle at this radius
const sBright = new Float32Array(N);  // base brightness [0.35, 1.0]
const sHue    = new Uint8Array(N);    // 0=pure white, 1=blue-white, 2=ionised-gas teal
const sSize2  = new Uint8Array(N);    // 1 → draw 5-pixel plus shape (bright giant stars)

for (let i = 0; i < N; i++) {
  const onArm = Math.random() < 0.74;
  let r, theta;

  if (onArm) {
    // Place star near a logarithmic spiral arm locus with Gaussian scatter
    const arm = (Math.random() * ARMS) | 0;
    r = 20 + Math.pow(Math.random(), 0.55) * (MAX_R - 20);
    theta = Math.log(r / A) / B + arm * ARM_STEP + gauss() * 0.32;
    r = Math.max(12, Math.min(MAX_R, r + gauss() * MAX_R * 0.035));
  } else {
    r = 8 + Math.sqrt(Math.random()) * MAX_R;
    r = Math.min(r, MAX_R);
    theta = Math.random() * TAU;
  }

  sR[i]      = r;
  sTheta[i]  = theta;
  sOmega[i]  = VC / Math.max(r, 10);
  sLogR[i]   = Math.log(r / A) / B;
  sBright[i] = 0.35 + Math.random() * 0.65;

  const rnd = Math.random();
  sHue[i]   = rnd < 0.03 ? 0 : rnd < 0.18 ? 2 : 1;
  sSize2[i] = rnd < 0.025 ? 1 : 0;
}

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const buf    = ctx.createImageData(W, H);
const D      = buf.data;

// Background fill buffer — set once, copied each frame
const BG = new Uint8ClampedArray(W * H * 4);
for (let i = 0; i < W * H * 4; i += 4) {
  BG[i] = 4; BG[i + 1] = 4; BG[i + 2] = 12; BG[i + 3] = 255;
}

// Colour table [R, G, B] for each hue class
const STAR_RGB = [
  [255, 255, 255], // pure white (bright giant)
  [240, 244, 255], // blue-white (main sequence)
  [128, 220, 220], // ionised-gas teal (HII region)
];

let tick = 0;

/**
 * Compute how close star i (at angle `theta`) is to the nearest spiral arm at
 * the current pattern phase.  Returns a value in (0, 1] via a Gaussian kernel:
 * prox = exp(−Δθ² / 2σ²), where Δθ is the angular distance to the nearest arm.
 * Stars at the arm centre get prox=1; stars far between arms get prox≈0.
 *
 * The arm locus at radius r and time `tick` is:
 *   θ_arm(r, t) = log(r/A)/B + arm_index·(2π/ARMS) + OMEGA_P·t
 * Using precomputed sLogR[i] avoids a log() call per star per frame.
 */
function armProx(i, theta) {
  const logR = sLogR[i];
  let best = 0;
  for (let a = 0; a < ARMS; a++) {
    let d = theta - (logR + a * ARM_STEP + OMEGA_P * tick);
    // Wrap angular distance into [-π, π] to find the shortest arc
    d -= Math.round(d / TAU) * TAU;
    const v = Math.exp(-d * d / SIG2);
    if (v > best) best = v;
  }
  return best;
}

/**
 * Write a star's RGB contribution into the ImageData buffer at pixel (px, py)
 * using additive blending so overlapping stars naturally bloom.
 */
function splat(px, py, r, g, b, k) {
  const idx = (py * W + px) * 4;
  D[idx]     = Math.min(255, D[idx]     + (r * k | 0));
  D[idx + 1] = Math.min(255, D[idx + 1] + (g * k | 0));
  D[idx + 2] = Math.min(255, D[idx + 2] + (b * k | 0));
}

function frame() {
  D.set(BG);
  tick++;

  for (let i = 0; i < N; i++) {
    sTheta[i] += sOmega[i];

    const theta = sTheta[i];
    const r     = sR[i];
    const px    = (CX + r * Math.cos(theta)) | 0;
    const py    = (CY + r * Math.sin(theta)) | 0;
    if (px < 1 || px >= W - 1 || py < 1 || py >= H - 1) continue;

    // Brightness modulated by proximity to nearest arm (density wave effect)
    const prox  = armProx(i, theta);
    const alpha = sBright[i] * (0.15 + 0.85 * Math.sqrt(prox));
    const col   = STAR_RGB[sHue[i]];
    const cr = col[0], cg = col[1], cb = col[2];

    splat(px, py, cr, cg, cb, alpha);

    if (sSize2[i]) {
      // Bright giant: add cross pixels at half alpha for a 5-pixel star shape
      const k2 = alpha * 0.5;
      splat(px + 1, py,     cr, cg, cb, k2);
      splat(px - 1, py,     cr, cg, cb, k2);
      splat(px,     py + 1, cr, cg, cb, k2);
      splat(px,     py - 1, cr, cg, cb, k2);
    }
  }

  ctx.putImageData(buf, 0, 0);

  // Galactic core bulge — warm amber radial gradient drawn over the star field
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 140);
  g.addColorStop(0.00, 'rgba(255,252,240,0.92)');
  g.addColorStop(0.06, 'rgba(245,166,35,0.78)');
  g.addColorStop(0.20, 'rgba(180,80,15,0.28)');
  g.addColorStop(0.50, 'rgba(60,20,5,0.07)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(CX, CY, 140, 0, TAU);
  ctx.fill();

  // Subtle arm glow — faint wide strokes trace the spiral loci
  ctx.save();
  ctx.translate(CX, CY);
  ctx.globalCompositeOperation = 'screen';
  for (let a = 0; a < ARMS; a++) {
    const armOff = a * ARM_STEP + OMEGA_P * tick;
    ctx.beginPath();
    let first = true;
    for (let r = 22; r <= MAX_R; r += 5) {
      const th = Math.log(r / A) / B + armOff;
      const x  = r * Math.cos(th);
      const y  = r * Math.sin(th);
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    const col = a === 1 ? 'rgba(100,200,200,0.035)' : 'rgba(180,180,255,0.025)';
    ctx.strokeStyle = col;
    ctx.lineWidth = 22;
    ctx.stroke();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}

ctx.fillStyle = '#04040c';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(frame);
</script>
</body>
</html>
