<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#e8dfc8"/>
  <g stroke="#3d2b1a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary crack A: seed from top, growing downward -->
    <polyline points="88,0 87,18 85,36 83,54 81,72 80,90 79,108 78,126 77,145 76,164 75,182 74,200"/>
    <!-- Crack B from left, grows right, hits A at ~(81,72) -->
    <polyline points="0,70 18,70 36,71 54,71 72,72 81,72"/>
    <!-- Perpendicular from hit B→A, growing up-right -->
    <polyline points="81,72 96,62 112,53 128,46 144,40 160,36 176,33 192,31 200,30"/>
    <!-- Crack C: seed from top-right growing down-left -->
    <polyline points="182,0 178,16 173,33 168,50 163,67 158,84 153,101 148,118 143,135 138,152 133,170 128,188 124,200"/>
    <!-- Perpendicular from C hitting B's path at ~(163,67) growing left-down -->
    <polyline points="163,67 161,84 159,101 158,118 157,135 156,152 155,170 154,188 153,200"/>
    <!-- Crack D: seed from bottom-left growing up-right -->
    <polyline points="0,185 12,175 25,164 39,154 53,144 66,134 79,124 79,108"/>
    <!-- Hit A at ~(79,108): perpendicular growing right -->
    <polyline points="79,108 95,111 112,114 129,117 146,120 163,122 180,124 200,126"/>
    <!-- Crack E: seed from right edge going left -->
    <polyline points="200,92 183,91 166,91 149,92 132,93 116,94 100,95"/>
    <!-- Hit A at ~(79,108) branch from E going down-right -->
    <polyline points="100,95 104,110 108,126 112,142 115,158 117,175 118,192 119,200"/>
    <!-- Crack F: seed from bottom-right corner -->
    <polyline points="200,190 188,178 175,167 162,156 149,146 137,136 125,127 114,118"/>
    <!-- Hit E path: perpendicular going up -->
    <polyline points="114,118 110,101 106,84 104,66 103,48 103,30 103,12 103,0"/>
  </g>
</svg>
