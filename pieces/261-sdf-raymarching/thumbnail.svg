<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
  <radialGradient id="void" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="#0a001a"/>
    <stop offset="100%" stop-color="#000508"/>
  </radialGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="45%">
    <stop offset="0%"   stop-color="#cc003c" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#cc003c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rimGlow" cx="50%" cy="50%" r="52%">
    <stop offset="0%"   stop-color="#00d4e0" stop-opacity="0"/>
    <stop offset="75%"  stop-color="#00d4e0" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#00d4e0" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur2">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="blur5">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<rect width="400" height="400" fill="url(#void)"/>

<!-- Octahedral mirror lattice: 8-fold symmetric tiled shapes -->
<!-- Central cluster -->
<g opacity="0.80">
  <!-- Central rounded square (suggests sphere+box blend) -->
  <rect x="175" y="175" width="50" height="50" rx="10" ry="10"
        fill="none" stroke="#cc003c" stroke-width="2.2"/>
  <circle cx="200" cy="200" r="28" fill="none" stroke="#e0104a" stroke-width="1.6" opacity="0.9"/>
  <!-- Cross arms -->
  <line x1="200" y1="175" x2="200" y2="145" stroke="#cc003c" stroke-width="1.4" opacity="0.7"/>
  <line x1="200" y1="225" x2="200" y2="255" stroke="#cc003c" stroke-width="1.4" opacity="0.7"/>
  <line x1="175" y1="200" x2="145" y2="200" stroke="#cc003c" stroke-width="1.4" opacity="0.7"/>
  <line x1="225" y1="200" x2="255" y2="200" stroke="#cc003c" stroke-width="1.4" opacity="0.7"/>
  <!-- Diagonal arms (octahedral symmetry) -->
  <line x1="180" y1="180" x2="155" y2="155" stroke="#b00034" stroke-width="1.1" opacity="0.6"/>
  <line x1="220" y1="180" x2="245" y2="155" stroke="#b00034" stroke-width="1.1" opacity="0.6"/>
  <line x1="180" y1="220" x2="155" y2="245" stroke="#b00034" stroke-width="1.1" opacity="0.6"/>
  <line x1="220" y1="220" x2="245" y2="245" stroke="#b00034" stroke-width="1.1" opacity="0.6"/>
</g>

<!-- Ring 1: 8 satellite nodes -->
<g opacity="0.65">
  <circle cx="200" cy="140" r="10" fill="none" stroke="#cc003c" stroke-width="1.5"/>
  <rect   x="193" cy="133" x="193" y="133" width="14" height="14" rx="3"
          fill="none" stroke="#aa0030" stroke-width="1.1" opacity="0.7"/>
  <circle cx="200" cy="260" r="10" fill="none" stroke="#cc003c" stroke-width="1.5"/>
  <circle cx="140" cy="200" r="10" fill="none" stroke="#cc003c" stroke-width="1.5"/>
  <circle cx="260" cy="200" r="10" fill="none" stroke="#cc003c" stroke-width="1.5"/>
  <circle cx="157" cy="157" r="8"  fill="none" stroke="#aa0030" stroke-width="1.3"/>
  <circle cx="243" cy="157" r="8"  fill="none" stroke="#aa0030" stroke-width="1.3"/>
  <circle cx="157" cy="243" r="8"  fill="none" stroke="#aa0030" stroke-width="1.3"/>
  <circle cx="243" cy="243" r="8"  fill="none" stroke="#aa0030" stroke-width="1.3"/>
</g>

<!-- Ring 2: outer lattice nodes (smaller) -->
<g opacity="0.40">
  <circle cx="200" cy="90"  r="6" fill="none" stroke="#880028" stroke-width="1.1"/>
  <circle cx="200" cy="310" r="6" fill="none" stroke="#880028" stroke-width="1.1"/>
  <circle cx="90"  cy="200" r="6" fill="none" stroke="#880028" stroke-width="1.1"/>
  <circle cx="310" cy="200" r="6" fill="none" stroke="#880028" stroke-width="1.1"/>
  <circle cx="116" cy="116" r="5" fill="none" stroke="#660020" stroke-width="1.0"/>
  <circle cx="284" cy="116" r="5" fill="none" stroke="#660020" stroke-width="1.0"/>
  <circle cx="116" cy="284" r="5" fill="none" stroke="#660020" stroke-width="1.0"/>
  <circle cx="284" cy="284" r="5" fill="none" stroke="#660020" stroke-width="1.0"/>
  <!-- lattice connectors -->
  <line x1="200" y1="140" x2="200" y2="90"  stroke="#880028" stroke-width="0.9" opacity="0.5"/>
  <line x1="200" y1="260" x2="200" y2="310" stroke="#880028" stroke-width="0.9" opacity="0.5"/>
  <line x1="140" y1="200" x2="90"  y2="200" stroke="#880028" stroke-width="0.9" opacity="0.5"/>
  <line x1="260" y1="200" x2="310" y2="200" stroke="#880028" stroke-width="0.9" opacity="0.5"/>
  <line x1="157" y1="157" x2="116" y2="116" stroke="#660020" stroke-width="0.8" opacity="0.45"/>
  <line x1="243" y1="157" x2="284" y2="116" stroke="#660020" stroke-width="0.8" opacity="0.45"/>
  <line x1="157" y1="243" x2="116" y2="284" stroke="#660020" stroke-width="0.8" opacity="0.45"/>
  <line x1="243" y1="243" x2="284" y2="284" stroke="#660020" stroke-width="0.8" opacity="0.45"/>
</g>

<!-- Cyan rim glow overlay -->
<rect width="400" height="400" fill="url(#rimGlow)"/>
<!-- Core crimson glow -->
<rect width="400" height="400" fill="url(#core)"/>

<!-- Central bright dot -->
<circle cx="200" cy="200" r="4" fill="#ff4477" opacity="0.9"/>
<circle cx="200" cy="200" r="8" fill="#ff4477" opacity="0.25" filter="url(#blur2)"/>
</svg>
