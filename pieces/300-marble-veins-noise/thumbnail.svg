<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Calacatta marble: ivory base with charcoal primary veins and taupe secondary veins -->
  <rect width="400" height="400" fill="#f5f0e8"/>

  <!-- Secondary veins — warm taupe #9e8e7a, sinuous and branching -->
  <g stroke="#9e8e7a" stroke-linecap="round" fill="none">
    <path stroke-width="1.1" opacity="0.55" d="M 0,58 C 55,65 110,52 165,74 C 215,95 265,82 320,105 C 355,120 375,118 400,125"/>
    <path stroke-width="0.9" opacity="0.45" d="M 0,188 C 65,182 118,196 172,191 C 225,186 275,200 330,196 C 360,194 380,197 400,200"/>
    <path stroke-width="0.85" opacity="0.40" d="M 28,0 C 35,48 32,96 38,148 C 44,198 41,248 48,296 C 53,335 58,365 62,400"/>
    <path stroke-width="0.75" opacity="0.38" d="M 292,0 C 298,42 294,84 300,132 C 306,172 302,222 308,266 C 313,305 317,350 320,400"/>
    <path stroke-width="0.80" opacity="0.42" d="M 0,308 C 68,302 132,318 192,312 C 244,307 296,322 352,316 C 375,313 388,315 400,318"/>
    <path stroke-width="0.70" opacity="0.36" d="M 118,0 C 113,58 106,116 110,172 C 114,228 118,278 113,332 C 110,358 107,378 109,400"/>
    <path stroke-width="0.65" opacity="0.32" d="M 0,132 C 82,126 164,140 242,133 C 300,128 352,136 400,132"/>
    <path stroke-width="0.75" opacity="0.40" d="M 198,0 C 204,52 196,104 200,158 C 204,202 198,252 203,296 C 206,330 210,364 213,400"/>
    <path stroke-width="0.60" opacity="0.30" d="M 0,252 C 75,247 148,260 220,254 C 278,249 335,258 400,252"/>
    <path stroke-width="0.55" opacity="0.28" d="M 350,0 C 345,55 350,110 344,162 C 338,210 342,258 336,304 C 332,338 328,368 326,400"/>
  </g>

  <!-- Primary veins — deep charcoal #2a2520, bold and geological -->
  <g stroke="#2a2520" stroke-linecap="round" fill="none">
    <path stroke-width="2.2" opacity="0.88" d="M 48,0 C 68,58 88,116 118,172 C 148,228 178,272 194,336 C 200,360 204,382 208,400"/>
    <path stroke-width="1.8" opacity="0.82" d="M 0,78 C 58,88 128,72 184,97 C 238,122 288,112 358,128 C 380,133 390,136 400,138"/>
    <path stroke-width="1.5" opacity="0.75" d="M 248,0 C 258,52 254,104 260,156 C 266,206 262,256 270,304 C 274,340 278,368 284,400"/>
    <path stroke-width="1.2" opacity="0.68" d="M 0,258 C 68,253 138,268 202,258 C 258,250 318,263 378,256 C 390,255 395,256 400,258"/>
  </g>

  <!-- Fine branching veins off primaries — add geological realism -->
  <g stroke="#2a2520" stroke-linecap="round" fill="none">
    <path stroke-width="0.65" opacity="0.58" d="M 118,172 C 132,178 148,176 162,184"/>
    <path stroke-width="0.55" opacity="0.48" d="M 184,97 C 196,112 202,122 206,138"/>
    <path stroke-width="0.60" opacity="0.52" d="M 260,156 C 274,163 282,172 290,182"/>
    <path stroke-width="0.50" opacity="0.45" d="M 202,258 C 216,268 226,274 238,284"/>
    <path stroke-width="0.50" opacity="0.42" d="M 358,128 C 365,140 368,152 370,165"/>
    <path stroke-width="0.45" opacity="0.40" d="M 270,304 C 280,315 285,325 288,338"/>
  </g>
</svg>
