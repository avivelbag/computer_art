<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050008"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Ionized-hydrogen crimson cloud body -->
    <radialGradient id="hydrogen" cx="45%" cy="55%" r="55%">
      <stop offset="0%"  stop-color="#c0103a" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#8a0a28" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#440010" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Oxygen-III teal filaments -->
    <radialGradient id="oxygen" cx="60%" cy="40%" r="45%">
      <stop offset="0%"  stop-color="#0aefb0" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#08b880" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#025040" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- UV violet haze -->
    <radialGradient id="uv" cx="35%" cy="45%" r="50%">
      <stop offset="0%"  stop-color="#a028dc" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#6010a0" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#200040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Bright knot highlight -->
    <radialGradient id="knot" cx="52%" cy="48%" r="20%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffd0f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Deep space void -->
  <rect width="400" height="300" fill="url(#void)"/>

  <!-- Scattered stars -->
  <g fill="white">
    <circle cx="22"  cy="18"  r="0.7" opacity="0.9"/>
    <circle cx="375" cy="32"  r="1.0" opacity="0.8"/>
    <circle cx="55"  cy="275" r="0.6" opacity="0.7"/>
    <circle cx="348" cy="258" r="0.9" opacity="0.85"/>
    <circle cx="12"  cy="160" r="0.5" opacity="0.7"/>
    <circle cx="390" cy="190" r="0.8" opacity="0.9"/>
    <circle cx="110" cy="22"  r="1.1" opacity="0.95"/>
    <circle cx="285" cy="268" r="0.7" opacity="0.8"/>
    <circle cx="355" cy="115" r="0.9" opacity="0.75"/>
    <circle cx="48"  cy="205" r="0.6" opacity="0.8"/>
    <circle cx="192" cy="8"   r="0.8" opacity="0.85"/>
    <circle cx="315" cy="288" r="1.0" opacity="0.7"/>
    <circle cx="142" cy="282" r="0.7" opacity="0.8"/>
    <circle cx="260" cy="15"  r="0.6" opacity="0.9"/>
    <circle cx="380" cy="80"  r="0.8" opacity="0.75"/>
    <circle cx="8"   cy="90"  r="0.7" opacity="0.85"/>
    <circle cx="330" cy="175" r="0.5" opacity="0.7"/>
    <circle cx="175" cy="290" r="0.9" opacity="0.8"/>
  </g>

  <!-- Additive emission layers (use screen-like stacking with opacity) -->

  <!-- Hydrogen alpha (crimson) — broad cloud body -->
  <rect width="400" height="300" fill="url(#hydrogen)" filter="url(#blur14)"/>

  <!-- Oxygen-III (teal) — mid-frequency filaments -->
  <rect width="400" height="300" fill="url(#oxygen)" filter="url(#blur8)"/>

  <!-- UV violet haze -->
  <rect width="400" height="300" fill="url(#uv)" filter="url(#blur8)"/>

  <!-- Central bright knot -->
  <rect width="400" height="300" fill="url(#knot)" filter="url(#blur4)"/>

  <!-- Thin bright filament wisps -->
  <ellipse cx="200" cy="155" rx="140" ry="18"
           fill="none" stroke="#0aefb0" stroke-width="1.5"
           opacity="0.18" filter="url(#blur4)"/>
  <ellipse cx="185" cy="148" rx="95" ry="12"
           fill="none" stroke="#c0103a" stroke-width="2"
           opacity="0.22" filter="url(#blur4)"/>
</svg>
