<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mondrian Recursion — The Rectangle That Cannot Stop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #s {
      display: block;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
    }
  </style>
</head>
<body>
  <svg id="s" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <rect id="bg" width="800" height="800" fill="#f5f2eb"/>
    <g id="cells"></g>
    <g id="lines">
      <rect id="outer" x="1" y="1" width="798" height="798"
            fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
  </svg>
  <script>
    const W = 800, H = 800;

    // Five curated palette colors: dusty rose, slate blue, ochre, off-white, sage green.
    // Off-white is also the resting/placeholder color so unsplit areas blend smoothly.
    const PALETTE = [
      '#c4888a',
      '#5f8fa8',
      '#c8a84b',
      '#f2ede0',
      '#8aaf96',
    ];

    const NEUTRAL   = '#f5f2eb'; // fill for non-leaf cells awaiting further splits
    const BORDER    = '#1a1a1a'; // near-black lines
    const BORDER_W  = 2;
    const MIN_CELL  = 40;        // minimum dimension to still allow a split
    const MAX_DEPTH = 6;
    const STEP_MS   = 80;        // delay between animation steps
    const HOLD_MS   = 4000;      // pause after the last leaf appears

    const svg    = document.getElementById('s');
    const cellsG = document.getElementById('cells');
    const linesG = document.getElementById('lines');
    const outer  = document.getElementById('outer'); // permanent border rect

    let timer = null;

    // ------------------------------------------------------------------
    // Palette helpers
    // ------------------------------------------------------------------

    function pickColor(avoid) {
      const pool = avoid ? PALETTE.filter(c => c !== avoid) : PALETTE;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /**
     * Return the colour of the leftmost reachable leaf in `node`.
     * Used so that a parent's right subtree can avoid matching the adjacent
     * left subtree's nearest visible cell.
     */
    function repColor(node) {
      return node.leaf ? node.color : repColor(node.left);
    }

    // ------------------------------------------------------------------
    // BSP tree construction
    // ------------------------------------------------------------------

    /**
     * Recursively partition `rect` via binary space partitioning.
     *
     * Split axis is biased by the rectangle's aspect ratio: wider rects
     * prefer a vertical line (left/right children) and taller rects prefer
     * a horizontal line (top/bottom children).  The split position is drawn
     * from 0.5 ± 0.2 to keep the composition organic without micro-slivers.
     *
     * @param rect       {x, y, w, h} in SVG coordinates
     * @param depth      remaining split depth
     * @param avoid      palette colour to avoid at this leaf (sibling's colour)
     * @returns          BSP node — leaf: {leaf, rect, color} or
     *                   internal: {leaf, rect, line, left, right}
     */
    function buildBSP(rect, depth, avoid) {
      const canH = rect.w >= MIN_CELL * 2; // vertical split (left / right)
      const canV = rect.h >= MIN_CELL * 2; // horizontal split (top / bottom)

      if (depth === 0 || (!canH && !canV)) {
        return { leaf: true, rect, color: pickColor(avoid) };
      }

      const ratio  = 0.5 + (Math.random() - 0.5) * 0.4; // 0.30 – 0.70
      const aspect = rect.w / rect.h;

      // pVert: probability of placing a vertical dividing line (left/right split)
      let pVert;
      if (!canH)      pVert = 0;
      else if (!canV) pVert = 1;
      else            pVert = Math.min(0.85, Math.max(0.15, aspect / (aspect + 1)));

      const doVert = Math.random() < pVert;

      let c1, c2, line; // line is [x1, y1, x2, y2]
      if (doVert) {
        const sx = Math.round(rect.x + rect.w * ratio);
        c1   = { x: rect.x, y: rect.y, w: sx - rect.x,          h: rect.h };
        c2   = { x: sx,      y: rect.y, w: rect.x + rect.w - sx, h: rect.h };
        line = [sx, rect.y, sx, rect.y + rect.h];
      } else {
        const sy = Math.round(rect.y + rect.h * ratio);
        c1   = { x: rect.x, y: rect.y, w: rect.w, h: sy - rect.y          };
        c2   = { x: rect.x, y: sy,     w: rect.w, h: rect.y + rect.h - sy };
        line = [rect.x, sy, rect.x + rect.w, sy];
      }

      const left  = buildBSP(c1, depth - 1, avoid);
      const right = buildBSP(c2, depth - 1, repColor(left));
      return { leaf: false, rect, line, left, right };
    }

    /**
     * Collect all internal BSP nodes in breadth-first order.
     * BFS = biggest rects first = most satisfying visual reveal.
     */
    function bfsEvents(tree) {
      const events = [];
      const q = [tree];
      while (q.length) {
        const n = q.shift();
        if (!n.leaf) {
          events.push(n);
          q.push(n.left, n.right);
        }
      }
      return events;
    }

    // ------------------------------------------------------------------
    // SVG element factories
    // ------------------------------------------------------------------

    function svgRect(parent, rect, fill) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      el.setAttribute('x', rect.x);
      el.setAttribute('y', rect.y);
      el.setAttribute('width', rect.w);
      el.setAttribute('height', rect.h);
      el.setAttribute('fill', fill);
      parent.appendChild(el);
      return el;
    }

    function svgLine(parent, coords) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', coords[0]);
      el.setAttribute('y1', coords[1]);
      el.setAttribute('x2', coords[2]);
      el.setAttribute('y2', coords[3]);
      el.setAttribute('stroke', BORDER);
      el.setAttribute('stroke-width', BORDER_W);
      parent.appendChild(el);
      return el;
    }

    // ------------------------------------------------------------------
    // Animation cycle
    // ------------------------------------------------------------------

    function clearSvg() {
      while (cellsG.firstChild) cellsG.removeChild(cellsG.firstChild);
      while (linesG.firstChild) linesG.removeChild(linesG.firstChild);
      // Restore the permanent outer border (removed above)
      linesG.appendChild(outer);
    }

    /**
     * Build a fresh BSP tree and animate its splits one-by-one.
     * After the last leaf appears the composition holds for HOLD_MS, then
     * fades back to neutral and restarts with a new random tree.
     */
    function start() {
      if (timer) clearTimeout(timer);
      clearSvg();

      const tree   = buildBSP({ x: 0, y: 0, w: W, h: H }, MAX_DEPTH, null);
      const events = bfsEvents(tree);
      let i = 0;

      function step() {
        if (i >= events.length) {
          timer = setTimeout(fadeOut, HOLD_MS);
          return;
        }
        const ev = events[i++];
        // Leaf children receive their committed palette colour; non-leaf children
        // show the neutral placeholder until their own split event arrives.
        svgRect(cellsG, ev.left.rect,  ev.left.leaf  ? ev.left.color  : NEUTRAL);
        svgRect(cellsG, ev.right.rect, ev.right.leaf ? ev.right.color : NEUTRAL);
        svgLine(linesG, ev.line);
        // Re-append the outer border so it always renders on top of all split lines.
        linesG.appendChild(outer);
        timer = setTimeout(step, STEP_MS);
      }

      step();
    }

    /**
     * Fade the composition to neutral white, then restart with a new tree.
     * The fade is driven by rAF for smooth easing.
     */
    function fadeOut() {
      const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      overlay.setAttribute('x', 0);
      overlay.setAttribute('y', 0);
      overlay.setAttribute('width', W);
      overlay.setAttribute('height', H);
      overlay.setAttribute('fill', NEUTRAL);
      overlay.setAttribute('opacity', 0);
      svg.appendChild(overlay);

      let alpha = 0;
      function tick() {
        alpha = Math.min(1, alpha + 0.025);
        overlay.setAttribute('opacity', alpha);
        if (alpha < 1) {
          requestAnimationFrame(tick);
        } else {
          svg.removeChild(overlay);
          start();
        }
      }
      requestAnimationFrame(tick);
    }

    start();
  </script>
</body>
</html>
